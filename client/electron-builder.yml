appId: dev.skyhook.client
productName: Skyhook
copyright: Copyright © Skyhook
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
asar: true
compression: maximum
linux:
  target:
    - AppImage
    - tar.gz
  category: Network
  synopsis: Split-architecture browser for high-latency links
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # Unsigned by design: this is a personal build, not a distributed product.
  identity: null
win:
  target:
    - nsis
    - zip
npmRebuild: false
# No native modules anywhere in the tree, which is what keeps cross-platform
# packaging a matter of copying JavaScript.
buildDependenciesFromSource: false
