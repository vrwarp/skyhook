name: CI

on:
  # Only main on push. A branch push and its pull request are the same commit,
  # so listening to both ran the whole suite — e2e and netem included — twice
  # for every commit on a branch with a PR open. The pull_request event covers
  # branch work; this covers what lands.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  go:
    name: Go build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # The e2e package needs a browser and runs in its own job.
        run: go test -race -count=1 $(go list ./... | grep -v '/test$')

      - name: Conformance fixtures are current
        # A drifted wire format must fail here, not on an aircraft.
        run: go test -count=1 ./internal/protocol -run Conformance -v

  golangci:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # v9 of the action still installs golangci-lint v2, which is the schema
      # .golangci.yml is written against.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=6m

  client:
    name: Client typecheck, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (includes cross-language conformance)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload built client
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  e2e:
    name: End-to-end against real Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        # The end-to-end suite drives the real PWA in a real browser, so the
        # client has to exist before the Go tests run.
        run: |
          cd client
          npm ci
          npm run build

      - name: Install the image encoders
        # Chrome is preinstalled on the runner; these give the transcoder its
        # good codecs instead of the stdlib fallbacks.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavif-bin webp

      - name: Locate a browser
        id: browser
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null; then
              echo "path=$(command -v $candidate)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no browser on the runner"
          exit 1

      - name: End-to-end tests
        env:
          # Skipping for want of a browser is a failure in CI, not a pass.
          SKYHOOK_E2E: '1'
          SKYHOOK_CHROME: ${{ steps.browser.outputs.path }}
        # Unshaped, so every harness takes an ephemeral port and nothing is
        # leased; the only limit on concurrency here is the runner. Each test
        # owns a Chromium and the PWA ones own two, so four at a time is about
        # what the box will carry.
        run: go test -count=1 -timeout 20m -parallel 4 -v ./test

  netem:
    name: End-to-end over an emulated 1.2s / 250kbps link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        # The end-to-end suite drives the real PWA in a real browser, so the
        # client has to exist before the Go tests run.
        run: |
          cd client
          npm ci
          npm run build

      - name: Install tc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2

      - name: Locate a browser
        id: browser
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null; then
              echo "path=$(command -v $candidate)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no browser on the runner"
          exit 1

      - name: Apply the link profile from the design document
        # 1.2s RTT, 250 kbps, 2% loss on loopback: the link every milestone is
        # measured against. Eight lanes of it, on ports 45123-45130, each with
        # a netem qdisc of its own — a rate is a per-qdisc budget, so tests on
        # one shaped port would divide the link between them and save nothing.
        # One lane per concurrent test is what makes this parallel.
        #
        # That the lanes are genuinely independent is measurable rather than
        # assumed: at four lanes the median test took 1.01x as long as it did
        # running alone, so each was getting a whole link and not a quarter of
        # one.
        run: sudo scripts/netem.sh lanes 45123 8 1200 250 2

      - name: End-to-end tests over the bad link
        env:
          SKYHOOK_E2E: '1'
          SKYHOOK_SLOW_LINK: '1'
          SKYHOOK_TEST_PORTS: '45123-45130'
          SKYHOOK_CHROME: ${{ steps.browser.outputs.path }}
        # Every test here pays 1.2s of latency per round trip, so this suite
        # grows with the test count far faster than the one above it, and the
        # budget has to be a budget rather than the last measurement plus
        # nothing. It was 25m, and on fd9b288 the suite took 24m48s and passed
        # with twelve seconds to spare — which is not passing, it is a coin
        # toss that had been landing the right way up. The next two changes to
        # merge each added tests and it started timing out at 1500s, with a
        # test three seconds in when the alarm went off; nothing was hung and
        # nothing was slow, there was simply no room left.
        #
        # 45m was roughly twice what the suite cost then, with a note saying
        # the answer next time was to make the suite cheaper rather than move
        # the number again. This is that: eight tests at a time, each leasing
        # one of the eight shaped lanes above. What the suite spends is
        # latency, and latency is the one cost that overlaps — a test waiting
        # on a round trip is using neither the link nor the CPU, so eight of
        # them wait together.
        #
        # Measured on this branch: the step took 37m06s before, and 9m46s at
        # four lanes. Eight is not a guess either — the suite is ~2135s of wall
        # clock over ~439s of CPU, so eight at once want about 1.6 of the
        # runner's 4 cores, where the unshaped job above already sustains 2.66.
        # Past eight the ~91s longest test starts setting the floor.
        #
        # 45m stays, and it is now a very wide margin over a short run rather
        # than a number that tracks the measurement. The next time it is close,
        # the lane count is the dial to turn, not this.
        run: go test -count=1 -timeout 45m -parallel 8 -v ./test

      - name: Remove the link profile
        if: always()
        run: sudo scripts/netem.sh down

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh deploy/entrypoint.sh
