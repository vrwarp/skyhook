# Skyhook behind nginx. Pair this with deploy/docker-compose.proxy.yml, which
# publishes the container on 127.0.0.1:4434 and speaks plain HTTP upstream.
#
# The server must be told where this listens:
#   SKYHOOK_PUBLIC_URL=https://skyhook.example.com   SKYHOOK_BEHIND_PROXY=1
#
# One whole origin, one upstream: the app, its service worker and the mirror
# socket all live here. Anything that rewrites paths or strips headers will
# break the app in ways that look like a Skyhook bug and are not.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skyhook.example.com;

    ssl_certificate     /etc/letsencrypt/live/skyhook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyhook.example.com/privkey.pem;

    # The mirror connection. Everything rides this one WebSocket.
    location /skyhook {
        proxy_pass http://127.0.0.1:4434;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # A mirrored tab can sit idle for as long as its reader does, and the
        # server's own 15-second ping is not traffic nginx counts. Anything
        # short here shows up plane-side as a connection that drops on every
        # long read — which looks exactly like the bad link Skyhook exists to
        # survive, and is not.
        proxy_read_timeout  12h;
        proxy_send_timeout  12h;

        # Frames are already zstd-compressed and latency matters more than
        # anything nginx would buy by holding them.
        proxy_buffering off;
    }

    # The PWA itself.
    location / {
        proxy_pass http://127.0.0.1:4434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Snapshots of a real page are large and already compressed.
        client_max_body_size 32m;
        gzip off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name skyhook.example.com;
    return 301 https://$host$request_uri;
}
