name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # A pull request builds the image and runs it, but publishes nothing. The
  # point is to find out that the image is broken before it is the image
  # everyone pulls — a Dockerfile only breaks when someone builds it.
  dry-run:
    name: Build the image without publishing it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # One architecture here: a dry run is about whether it builds and
          # runs, and amd64 is the only one this runner can execute natively.
          # The multi-arch build happens on the publish path.
          platforms: linux/amd64
          push: false
          load: true
          tags: skyhook:pr
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It prepares a data directory
        run: |
          # -init mints a token and a certificate and exits. It must not need a
          # browser: preparing a data directory has no business depending on
          # whether Chromium can launch.
          docker run --rm -e SKYHOOK_DATA_DIR=/tmp/skyhook skyhook:pr -init
          docker run --rm skyhook:pr -version | grep -q skyhookd

      - name: The client is in the image
        run: |
          # The PWA is served from the image; a missing build would only show
          # up as an unhelpful page at runtime.
          docker run --rm --entrypoint sh skyhook:pr \
            -c 'test -f /usr/share/skyhook/webapp/index.html &&
                test -f /usr/share/skyhook/webapp/sw.js'

      - name: It serves
        run: |
          # The real test: Chromium starts, the listeners come up, and the
          # server answers. An image whose browser cannot launch is exactly the
          # failure a dry run exists to catch.
          docker run -d --name smoke --shm-size=1g -p 4434:4434 \
            -e SKYHOOK_HOSTS=127.0.0.1 -e SKYHOOK_LOG_LEVEL=debug \
            skyhook:pr
          ok=false
          for _ in $(seq 1 45); do
            if curl -fsk https://127.0.0.1:4434/healthz >/dev/null 2>&1; then
              ok=true
              break
            fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then
              echo "::error::the container exited before it served anything"
              break
            fi
            sleep 2
          done
          echo "--- container log ---"
          docker logs smoke 2>&1 | tail -40
          docker rm -f smoke >/dev/null
          if [ "$ok" != true ]; then
            echo "::error::the image never answered /healthz"
            exit 1
          fi
          echo "the image serves"

  publish:
    name: Build and publish the landside image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      # Docker Hub is optional: a fork, or this repository before anyone sets
      # the secrets, should still publish to GHCR rather than failing at the
      # login step. `secrets` is not available to a job-level `if`, so the
      # decision is made here and carried in an output.
      - name: Which registries can we reach
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || github.repository }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            images="${images}"$'\n'"docker.io/${DOCKERHUB_REPO}"
            echo "::notice::Publishing to Docker Hub as ${DOCKERHUB_REPO}"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN unset; GHCR only"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # A VPS is amd64; a home-lab arm box is a reasonable second target.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          # The published image must mint its own credentials and then actually
          # serve, browser and all.
          image=ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)
          docker run --rm -e SKYHOOK_DATA_DIR=/tmp/skyhook "$image" -init
          docker run -d --name smoke --shm-size=1g -p 4434:4434 \
            -e SKYHOOK_HOSTS=127.0.0.1 "$image"
          ok=false
          for _ in $(seq 1 45); do
            if curl -fsk https://127.0.0.1:4434/healthz >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke >/dev/null
          [ "$ok" = true ]
