# Lint configuration. The set is deliberately modest: this is a personal tool
# where an unhelpfully strict linter costs more than it catches.
version: "2"

run:
  timeout: 6m
  tests: true

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    misspell:
      locale: UK
  exclusions:
    rules:
      # Tests exercise error paths deliberately and read fixtures by path.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
