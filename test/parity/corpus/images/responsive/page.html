<!DOCTYPE html>
<html>
<head>
<title>responsive images</title>
<style>
  html { color: rgb(0, 0, 0); font-family: arial, sans-serif; }
  body { margin: 0; padding: 8px; }
  h1 { margin: 0; font-size: 20px; }
  img { width: 80px; height: 60px; }
</style>
</head>
<body>
  <h1>one rendition of many</h1>
  <p>renditions settled</p>
  <img src="small.png" srcset="small.png 1x, large.png 2x" alt="a density choice">
  <picture>
    <source media="(min-width: 10px)" srcset="art.png">
    <img src="small.png" alt="an art-directed choice">
  </picture>
</body>
</html>
