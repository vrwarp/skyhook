<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skyhook</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#111827" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header id="chrome">
      <div id="tabstrip" role="tablist"></div>
      <div id="toolbar">
        <button id="back" title="Back">&#8592;</button>
        <button id="forward" title="Forward">&#8594;</button>
        <button id="reload" title="Reload">&#8635;</button>
        <input id="urlbar" type="text" spellcheck="false"
               placeholder="Address, or search" autocomplete="off" />
        <button id="bookmark" title="Bookmark this page">&#9733;</button>
        <button id="chat" title="Chat">Chat</button>
        <div id="hud" title="Link health">
          <span id="hud-state" class="offline">offline</span>
          <span id="hud-rtt">--</span>
          <span id="hud-queue">q0</span>
          <span id="hud-bytes">0 KB</span>
        </div>
      </div>
    </header>

    <!-- One sandboxed iframe per tab lives here. They carry
         sandbox="allow-same-origin" and deliberately not allow-scripts, so the
         browser itself guarantees no page JavaScript ever runs plane-side. -->
    <main id="frames"></main>

    <aside id="panel" hidden>
      <div id="panel-header">
        <strong id="panel-title">Chat</strong>
        <button id="panel-close">&times;</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <dialog id="pairing">
      <form id="pairing-form" method="dialog">
        <h2>Pair with your server</h2>
        <p>
          Paste the contents of <code>pairing.json</code> from the server's data
          directory. It carries the token and the certificate fingerprint this
          client pins.
        </p>
        <textarea id="pairing-json" rows="10" spellcheck="false"
                  placeholder='{ "host": "vps.example.com", "port": 4433, ... }'></textarea>
        <p id="pairing-error" class="error"></p>
        <button type="submit">Pair</button>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
