<!DOCTYPE html>
<html>
<head>
<title>margin collapse</title>
<style>
  html { color: rgb(0, 0, 0); font-family: arial, sans-serif; background: rgb(255, 255, 255); }
  body { margin: 0; }
  /* The first element's top margin has nothing to stop it: no border, no
     padding, no clearance. Landside it collapses through body and the page
     starts 30px down; at the mirror boundary that gap is lost (P-120). */
  h1 { margin: 30px 0 0 0; font-size: 20px; }
  p { margin: 8px 0; }
</style>
</head>
<body>
  <h1>thirty pixels above me</h1>
  <p>collapse settled</p>
</body>
</html>
