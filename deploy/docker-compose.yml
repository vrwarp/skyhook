# A single-user deployment. The data volume holds the browser profile — real
# cookies, real logins — so put it on an encrypted disk (see docs/OPERATIONS.md).
services:
  skyhook:
    image: ghcr.io/vrwarp/skyhook:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
      - "4434:4434/tcp"
    volumes:
      - skyhook-data:/data
    environment:
      SKYHOOK_CONFIG: /data/config.json
      SKYHOOK_HOSTS: ${SKYHOOK_HOSTS:-localhost}
      SKYHOOK_LOG_LEVEL: ${SKYHOOK_LOG_LEVEL:-info}
      # Headful under Xvfb is the default; set 0 for headless, which is
      # lighter and more conspicuous.
      SKYHOOK_HEADFUL: ${SKYHOOK_HEADFUL:-1}
      # Behind a reverse proxy, use docker-compose.proxy.yml instead: the
      # server has to be told the address the proxy answers on, because
      # everything it hands the client is built from it.
      SKYHOOK_PUBLIC_URL: ${SKYHOOK_PUBLIC_URL:-}
      SKYHOOK_BEHIND_PROXY: ${SKYHOOK_BEHIND_PROXY:-0}
    # Chromium wants more shared memory than the container default.
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "/usr/local/bin/skyhookctl", "pairing", "-file", "/data/pairing.json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  skyhook-data:
