<!DOCTYPE html>
<html>
<head>
<title>windows that open elsewhere</title>
<style>
  html { color: rgb(0, 0, 0); font-family: arial, sans-serif; }
  body { margin: 0; padding: 8px; }
  h1 { margin: 0; font-size: 20px; }
  div { min-height: 18px; }
</style>
</head>
<body>
  <h1>a door that opens off-stage</h1>
  <p>windows settled</p>
  <button id="open">open a window</button>
  <div id="out">not opened</div>
  <script>
    document.getElementById('open').addEventListener('click', function () {
      window.open('{{SITE}}/nav/target-blank/second.html');
      document.getElementById('out').textContent = 'opened one';
    });
  </script>
</body>
</html>
