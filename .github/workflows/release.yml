name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  server:
    name: Server binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          OUT="skyhook-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$OUT"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/$OUT/skyhookd" ./cmd/skyhookd
          go build -trimpath -ldflags "-s -w" \
            -o "dist/$OUT/skyhookctl" ./cmd/skyhookctl
          cp README.md docs/OPERATIONS.md deploy/skyhook.service "dist/$OUT/"
          tar -C dist -czf "dist/$OUT.tar.gz" "$OUT"
          (cd dist && sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*

  client:
    name: Client bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package
        # The client is a PWA: the deliverable is a directory of static files
        # the server hands to the browser, not a per-platform installer.
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          OUT="skyhook-client-${VERSION}"
          mkdir -p "../dist"
          tar -C dist -czf "../dist/$OUT.tar.gz" .
          (cd ../dist && sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: dist/*

  publish:
    name: Publish the release
    needs: [server, client]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
