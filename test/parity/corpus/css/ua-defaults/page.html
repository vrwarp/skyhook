<!DOCTYPE html>
<html>
<head>
<title>ua defaults</title>
<!-- No styles at all, deliberately: this page is the measurement of what a
     document that trusts the UA's defaults looks like through the mirror.
     Landside that means black serif text; the mirror's own chrome stylesheet
     sets color and font on its root, and both inherit into the page. -->
</head>
<body>
  <h1>a page with no opinions</h1>
  <p>defaults settled</p>
  <p>The quick brown fox jumps over the lazy dog, in whatever face and colour
     the browser chose, which is the entire point of this page.</p>
</body>
</html>
