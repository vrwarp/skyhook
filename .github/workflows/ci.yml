name: CI

on:
  # Only main on push. A branch push and its pull request are the same commit,
  # so listening to both ran the whole suite — e2e and netem included — twice
  # for every commit on a branch with a PR open. The pull_request event covers
  # branch work; this covers what lands.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  go:
    name: Go build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # The e2e package needs a browser and runs in its own job.
        run: go test -race -count=1 $(go list ./... | grep -v '/test$')

      - name: Conformance fixtures are current
        # A drifted wire format must fail here, not on an aircraft.
        run: go test -count=1 ./internal/protocol -run Conformance -v

  golangci:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # v9 of the action still installs golangci-lint v2, which is the schema
      # .golangci.yml is written against.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=6m

  client:
    name: Client typecheck, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (includes cross-language conformance)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload built client
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  e2e:
    name: End-to-end against real Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        # The end-to-end suite drives the real PWA in a real browser, so the
        # client has to exist before the Go tests run.
        run: |
          cd client
          npm ci
          npm run build

      - name: Install the image encoders
        # Chrome is preinstalled on the runner; these give the transcoder its
        # good codecs instead of the stdlib fallbacks.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavif-bin webp

      - name: Locate a browser
        id: browser
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null; then
              echo "path=$(command -v $candidate)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no browser on the runner"
          exit 1

      - name: End-to-end tests
        env:
          # Skipping for want of a browser is a failure in CI, not a pass.
          SKYHOOK_E2E: '1'
          SKYHOOK_CHROME: ${{ steps.browser.outputs.path }}
        # Unshaped, so every harness takes an ephemeral port and nothing is
        # leased; the only limit on concurrency here is the runner. Each test
        # owns a Chromium and the PWA ones own two, so four at a time is about
        # what the box will carry.
        #
        # -skip keeps the parity suite in its own job below. The set run here
        # is no longer the one that number was measured over: the gap-fix
        # campaign added twelve tests, the feature pins among them. Re-measured
        # at 2m08s on this runner (main at 9292c0c, run 32430097193 attempt 2),
        # so the 20m budget is a very wide margin rather than a close fit.
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -parallel 4 -skip '^TestParity' -v ./test 2>&1 | tee /tmp/e2e.log

      # Which test failed, on its own, at the end of the log.
      #
      # A verbose suite of parallel tests buries the one line that matters under
      # a browser's startup noise: the tail of a failed run is whatever finished
      # last, and the failure is somewhere in the middle with no way to grep a
      # log this size through the API. Naming the tests here is a minute now
      # against a quarter of an hour of guessing later.
      - name: Which tests failed
        if: failure()
        run: |
          echo '### Failed tests' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(\s+)?--- FAIL' /tmp/e2e.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '### What they said' >> "$GITHUB_STEP_SUMMARY"
          grep -E '_test\.go:[0-9]+:' /tmp/e2e.log | tail -40 | tee -a "$GITHUB_STEP_SUMMARY" || true

  parity:
    name: Rendering parity against the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        # The parity runner drives the real PWA, same as the e2e job.
        run: |
          cd client
          npm ci
          npm run build

      - name: Install the image encoders
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavif-bin webp

      - name: Locate a browser
        id: browser
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null; then
              echo "path=$(command -v $candidate)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no browser on the runner"
          exit 1

      - name: Parity suite
        env:
          SKYHOOK_E2E: '1'
          SKYHOOK_CHROME: ${{ steps.browser.outputs.path }}
          SKYHOOK_PARITY_OUT: /tmp/parity
        # Unshaped on purpose: parity is a correctness property and the
        # settled document is the same at any link speed; the netem job runs
        # at its measured capacity and this suite would double it.
        #
        # 30m is the Makefile's budget. Measured on the dev box at 3m36s
        # (-parallel 4, the full 29-page corpus including real/, final run on
        # the branch that added it); replace with the first CI measurement.
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m -parallel 4 -run '^TestParity' -v ./test 2>&1 | tee /tmp/parity.log

      - name: Scoreboard into the job summary
        # On failure too: the scoreboard of a failing run is the diagnosis.
        if: always()
        run: |
          if [ -f /tmp/parity/scoreboard.md ]; then
            cat /tmp/parity/scoreboard.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no scoreboard was written' >> "$GITHUB_STEP_SUMMARY"
          fi

      # As in the e2e job: the failure of a parallel suite is not where the
      # log ends.
      - name: Which tests failed
        if: failure()
        run: |
          echo '### Failed tests' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(\s+)?--- FAIL' /tmp/parity.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '### What they said' >> "$GITHUB_STEP_SUMMARY"
          grep -E '_test\.go:[0-9]+:' /tmp/parity.log | tail -40 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the scoreboard and reports
        # The full per-page reports ride along so a baseline can be rewritten
        # from a CI run without reproducing it locally.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-scoreboard
          path: /tmp/parity
          retention-days: 30
          if-no-files-found: ignore

  netem:
    name: End-to-end over an emulated 1.2s / 250kbps link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the client
        # The end-to-end suite drives the real PWA in a real browser, so the
        # client has to exist before the Go tests run.
        run: |
          cd client
          npm ci
          npm run build

      - name: Install tc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2

      - name: Locate a browser
        id: browser
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null; then
              echo "path=$(command -v $candidate)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no browser on the runner"
          exit 1

      - name: Apply the link profile from the design document
        # 1.2s RTT, 250 kbps, 2% loss on loopback: the link every milestone is
        # measured against. Eight lanes of it, on ports 21123-21130, each with
        # a netem qdisc of its own — a rate is a per-qdisc budget, so tests on
        # one shaped port would divide the link between them and save nothing.
        # One lane per concurrent test is what makes this parallel.
        #
        # That the lanes are genuinely independent is measurable rather than
        # assumed: at four lanes the median test took 1.01x as long as it did
        # running alone, so each was getting a whole link and not a quarter of
        # one.
        run: sudo scripts/netem.sh lanes 21123 8 1200 250 2

      - name: End-to-end tests over the bad link
        env:
          SKYHOOK_E2E: '1'
          SKYHOOK_SLOW_LINK: '1'
          SKYHOOK_TEST_PORTS: '21123-21130'
          SKYHOOK_CHROME: ${{ steps.browser.outputs.path }}
        # Every test here pays 1.2s of latency per round trip, so this suite
        # grows with the test count far faster than the one above it, and the
        # budget has to be a budget rather than the last measurement plus
        # nothing. It was 25m, and on fd9b288 the suite took 24m48s and passed
        # with twelve seconds to spare — which is not passing, it is a coin
        # toss that had been landing the right way up. The next two changes to
        # merge each added tests and it started timing out at 1500s, with a
        # test three seconds in when the alarm went off; nothing was hung and
        # nothing was slow, there was simply no room left.
        #
        # 45m was roughly twice what the suite cost then, with a note saying
        # the answer next time was to make the suite cheaper rather than move
        # the number again. This is that: eight tests at a time, each leasing
        # one of the eight shaped lanes above. What the suite spends is
        # latency, and latency is the one cost that overlaps — a test waiting
        # on a round trip is using neither the link nor the CPU, so eight of
        # them wait together.
        #
        # Measured on this branch: 37m06s before, 9m46s at four lanes, 5m34s
        # at eight. Contention stayed flat across that — against the same tests
        # run alone, the median test took 1.01x as long at four lanes and 1.02x
        # at eight, so the lanes really are separate links and not one link
        # divided up.
        #
        # Eight rather than more because the gain is thinning and the cost is
        # not: the longest single test is ~98s, which floors the suite near
        # 165s however many lanes it gets, and every extra lane is another one
        # or two Chromiums resident. If this ever needs to be faster again, the
        # thing to shorten is that longest test, not this number.
        #
        # 45m stays, and it is now a very wide margin over a short run rather
        # than a number that tracks the measurement. The next time it is close,
        # the lane count is the dial to turn, not this.
        #
        # -skip keeps the parity suite out: it runs unshaped in its own job —
        # the settled document is the same at any link speed — and this suite
        # stays exactly the set its numbers above were measured over.
        run: |
          set -o pipefail
          go test -count=1 -timeout 45m -parallel 8 -skip '^TestParity' -v ./test 2>&1 | tee /tmp/netem.log

      # As above: the failure of a parallel suite is not where the log ends.
      - name: Which tests failed
        if: failure()
        run: |
          echo '### Failed tests over the bad link' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(\s+)?--- FAIL' /tmp/netem.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          # What each of them said. Test log lines are few and the browser's
          # noise is not, so this is the whole of the evidence in ten lines.
          echo '### What they said' >> "$GITHUB_STEP_SUMMARY"
          grep -E '_test\.go:[0-9]+:' /tmp/netem.log | tail -40 | tee -a "$GITHUB_STEP_SUMMARY" || true
          # And whether the mirror was repairing itself in a loop, which is what
          # a link this slow turns any re-send into.
          echo '### Resyncs' >> "$GITHUB_STEP_SUMMARY"
          grep -cE 'resync by snapshot' /tmp/netem.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -E 'stalled|mirror divergence' /tmp/netem.log | tail -20 || true

      - name: Remove the link profile
        if: always()
        run: sudo scripts/netem.sh down

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # Both directories by glob rather than by name. deploy/ was named a
        # file at a time, which held for as long as it had one script in it:
        # the dns-01 hook example arrived beside entrypoint.sh and was not
        # checked, and that one is worse to leave unchecked than most, because
        # it is meant to be copied and edited rather than run from here.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh deploy/*.sh
