<!DOCTYPE html>
<html>
<head>
<title>touch drag-pan</title>
<style>
  html { color: rgb(0, 0, 0); font-family: arial, sans-serif; }
  body { margin: 0; padding: 8px; }
  h1 { margin: 0; font-size: 20px; }
  div { min-height: 18px; }
  /* A pan surface the way a map draws one: the gesture claimed from the
     browser with touch-action: none, pointer events doing the work. */
  #pad {
    position: relative; width: 300px; height: 140px; margin: 6px 0; overflow: hidden;
    border: 1px solid rgb(120, 120, 120); background: rgb(245, 245, 250);
    touch-action: none; user-select: none; cursor: grab;
  }
  #chip {
    position: absolute; left: 10px; top: 55px; width: 60px; height: 30px;
    background: rgb(90, 90, 200);
  }
</style>
</head>
<body>
  <h1>touch drag-pan</h1>
  <p>pan settled</p>
  <button id="poke">poke</button>
  <div id="poked">poked: no</div>
  <div id="pad"><div id="chip"></div></div>
  <div id="pointer">pointer: none</div>
  <div id="panned">panned: not yet</div>
  <div id="points">points: ?</div>
  <script>
    // The positive control: the page's listener wiring must work over the
    // mirror before the gesture is blamed.
    document.getElementById('poke').addEventListener('click', function () {
      document.getElementById('poked').textContent = 'poked: yes';
    });

    // What the machine claims to be is half the measurement: a page that
    // branches on touch support does it off maxTouchPoints, and the mirror's
    // reader really is on a touchscreen.
    document.getElementById('points').textContent =
      'points: ' + (navigator.maxTouchPoints > 0 ? 'touch' : 'mouse-only');

    // The pan itself, pointer events as a map pans: the chip follows the
    // finger, and the report is quantised so a sample of drift cannot flap
    // it. The pointer's own type is the other half of the measurement.
    var pad = document.getElementById('pad');
    var chip = document.getElementById('chip');
    var startX = null, chipLeft = 10;
    pad.addEventListener('pointerdown', function (e) {
      startX = e.clientX;
      document.getElementById('pointer').textContent = 'pointer: ' + e.pointerType;
      pad.setPointerCapture(e.pointerId);
    });
    pad.addEventListener('pointermove', function (e) {
      if (startX === null) return;
      chip.style.left = Math.max(0, Math.min(230, chipLeft + (e.clientX - startX))) + 'px';
    });
    pad.addEventListener('pointerup', function (e) {
      if (startX === null) return;
      var dx = e.clientX - startX;
      chipLeft = parseInt(chip.style.left, 10) || chipLeft;
      document.getElementById('panned').textContent =
        'panned: ' + (dx > 60 ? 'far' : 'hardly');
      startX = null;
    });
  </script>
</body>
</html>
